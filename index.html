<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Ferme · Estudio de historias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --white:#fff; --light:#F3F2EF; --offwhite:#F8F8F6; --ink:#2A2620; --oak:#8B6B4A;
    --olive:#3A3A31; --espresso:#241D18; --sage:#6E7A62; --line:#E3E1DC; --muted:#7A746B;
    --serif:"Libre Caslon Text",Georgia,serif; --sans:"Instrument Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--offwhite);font-size:14px}
  button{font:inherit;cursor:pointer;color:inherit}
  input,textarea,select{font:inherit;color:inherit}

  /* ---------- Barra ---------- */
  .bar{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:30}
  .bar .brandlink{display:flex;align-items:center;gap:14px;background:none;border:0}
  .bar .brandlink svg{width:132px;height:auto;display:block;color:var(--ink)}
  .bar .crumb{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
  .btn{border:1px solid var(--ink);background:#fff;padding:9px 16px;border-radius:4px;font-weight:500;white-space:nowrap}
  .btn:hover{background:var(--light)}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.dark:hover{background:#000}
  .btn.ghost{border-color:var(--line)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
  .seg button{border:0;background:none;padding:7px 13px;font-size:13px}
  .seg button.on{background:var(--ink);color:#fff}
  .inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ---------- Inicio ---------- */
  .home{max-width:1100px;margin:0 auto;padding:56px 20px 90px}
  .home h1{font:400 44px/1.1 var(--serif);text-align:center}
  .home .sub{text-align:center;color:var(--muted);margin:12px auto 28px;max-width:560px;line-height:1.5}
  .home .fmt{display:flex;justify-content:center;gap:12px;margin-bottom:36px;align-items:center;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .tcard{background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px 24px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
  .tcard:hover{border-color:var(--ink);transform:translateY(-2px)}
  .tcard .sw{display:flex;gap:6px}
  .tcard .sw i{width:18px;height:18px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .tcard h2{font:400 26px var(--serif)}
  .tcard p{color:var(--muted);line-height:1.5}
  .tcard .seq{font-size:11px;color:var(--oak);letter-spacing:.12em;text-transform:uppercase;margin-top:auto;padding-top:6px}
  .tcard .badge-shop{font-size:11px;color:var(--muted)}

  /* ---------- Editor ---------- */
  .editor{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 64px)}
  .side{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:4px 20px 80px}
  .stage{overflow:auto;padding:22px 24px 60px;background:#E9E7E2}
  .stage.story{--H:1920px;--s:.26}
  .stage.post{--H:1350px;--s:.3}
  .sec{border-bottom:1px solid var(--line);padding:18px 0}
  .sec h3{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sec h3 .count{font-weight:500;letter-spacing:0;text-transform:none}
  .f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .f label{font-size:12px;color:var(--muted)}
  .f input[type=text],.f textarea,.f select,.sel{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:#fff;width:100%}
  .f textarea{resize:vertical;min-height:60px;line-height:1.4}
  .f input:focus,.f textarea:focus,.pi input[type=text]:focus{outline:2px solid rgba(139,107,74,.35);border-color:var(--oak)}
  .tog{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
  .help{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
  .msg{font-size:12px;margin-top:8px;line-height:1.4;color:var(--muted)}
  .msg.err{color:#a3392f}
  .msg.ok{color:#4f6b3c}
  .plist{margin-top:8px}
  .pi{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .pi.off .th,.pi.off .pmain{opacity:.4}
  .th{width:52px;height:65px;background:#eee center/cover no-repeat;border-radius:3px;position:relative}
  .th.cyc{cursor:pointer}
  .th .n{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:0 4px;border-radius:3px}
  .pi input[type=text]{border:1px solid transparent;padding:4px 6px;border-radius:3px;width:100%;background:transparent}
  .pi input[type=text]:hover{border-color:var(--line)}
  .pmain{display:flex;flex-direction:column;gap:2px;min-width:0}
  .prow{display:flex;gap:6px;align-items:center}
  .acts{display:flex;gap:2px}
  .icon{border:0;background:none;min-width:24px;height:24px;border-radius:3px;color:var(--muted);font-size:13px;padding:0 4px}
  .icon:hover{background:var(--light);color:var(--ink)}
  .thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
  .thumbs .t{aspect-ratio:4/5;background:#eee center/cover no-repeat;border-radius:3px;cursor:pointer;border:2px solid transparent}
  .thumbs .t.on{border-color:var(--ink)}
  .imgrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .pill{font-size:10px;background:var(--light);border-radius:10px;padding:2px 7px;color:var(--muted);white-space:nowrap}
  details.cat{border:1px solid var(--line);border-radius:6px;padding:0 12px 12px;margin-bottom:10px}
  details.cat summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0;cursor:pointer}
  details.cat summary::-webkit-details-marker{display:none}
  details.cat summary::before{content:'›';display:inline-block;transition:transform .15s;color:var(--muted);font-size:16px}
  details.cat[open] summary::before{transform:rotate(90deg)}
  details.cat .cname{font:400 18px var(--serif);flex:1}
  details.cat .count{font-size:12px;color:var(--muted)}
  .card-step{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .stagebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
  .stagebar .hint{color:var(--muted);font-size:12px;max-width:440px;line-height:1.4}
  .slides{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
  .card{display:flex;flex-direction:column;gap:8px;align-items:center}
  .card .meta{font-size:12px;color:var(--muted);max-width:calc(1080px*var(--s));text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frame{width:calc(1080px*var(--s));height:calc(var(--H)*var(--s));position:relative;overflow:hidden;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);background:#fff}
  .frame>.slide{transform:scale(var(--s));transform-origin:0 0;position:absolute;top:0;left:0}
  .empty{color:var(--muted);padding:40px 0}
  .bgpick{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(1080px*var(--s) + 20px)}
  .bgpick .sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0;position:relative}
  .bgpick .sw.on{outline:2px solid var(--ink);outline-offset:2px}
  .bgpick .custom{overflow:hidden;background:conic-gradient(#e55,#eb5,#5c5,#5ce,#55e,#c5c,#e55);cursor:pointer}
  .bgpick .custom input{position:absolute;inset:-4px;width:30px;height:30px;opacity:0;cursor:pointer;border:0;padding:0}
  .bgpick .icon{min-width:20px;height:20px;font-size:12px}
  #exportHost{position:fixed;left:-40000px;top:0}
  @media (max-width:880px){
    .editor{grid-template-columns:1fr;height:auto}
    .side{border-right:0;border-bottom:1px solid var(--line);max-height:none}
    .bar .crumb{display:none}
  }

  /* =========================================================
     DIAPOSITIVAS (1080 × 1920 historia / 1080 × 1350 post)
     ========================================================= */
  .slide{width:1080px;position:relative;overflow:hidden;font-family:var(--sans);color:var(--ink);background:#fff}
  .slide.fmt-story{height:1920px}
  .slide.fmt-post{height:1350px}
  .slide.tone-dark{color:#fff}
  .slide .top{position:absolute;left:0;right:0;text-align:center;z-index:2;line-height:0}
  .fmt-story .top{top:262px}
  .fmt-post .top{top:72px}
  .slide .logo{width:360px;height:auto;display:inline-block}
  .fmt-post .logo{width:300px}
  .slide .photo{position:absolute;overflow:hidden;background:#E6E6E4;cursor:pointer}
  .tone-dark .photo{background:rgba(255,255,255,.1)}
  .slide .photo img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
  .slide .photo.has{cursor:grab;touch-action:none}
  .slide .photo .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;color:rgba(0,0,0,.38);padding:40px;line-height:1.4}
  .tone-dark .photo .hint{color:rgba(255,255,255,.5)}
  .slide .photo.has .hint{display:none}
  .slide .chg{position:absolute;right:24px;bottom:24px;font:500 26px var(--sans);padding:14px 22px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:6px;display:none;z-index:3}
  .slide .photo.has .chg{display:block}
  .slide .kicker{font-size:28px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;opacity:.72;margin-bottom:24px}
  .slide .accent{color:var(--oak);opacity:1}
  .tone-dark .accent{color:inherit;opacity:.72}
  .slide .title{font-family:var(--serif);font-weight:400;line-height:1.08;letter-spacing:-.01em}
  .slide .body{font-size:38px;line-height:1.5;opacity:.88}
  .slide .price{font-size:44px;letter-spacing:.02em}
  .slide .price s{opacity:.5;margin-left:16px;font-size:.8em}
  .slide .badge{display:inline-block;background:var(--ink);color:#fff;font-size:26px;padding:8px 20px;border-radius:30px;margin-left:16px;vertical-align:middle}
  .tone-dark .badge{background:#fff;color:var(--ink)}
  .slide .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 28%,rgba(0,0,0,.12) 50%,rgba(0,0,0,.62) 100%)}

  /* Portada */
  .k-cover .photo{inset:0;background:transparent}
  .k-cover .photo .hint{align-items:flex-start;padding-top:40%}
  .k-cover .text{position:absolute;left:90px;right:90px}
  .fmt-story.k-cover .text{bottom:400px}
  .fmt-post.k-cover .text{bottom:110px;left:80px;right:80px}
  .k-cover .title{font-size:132px;line-height:1.02;margin-bottom:28px}
  .fmt-post.k-cover .title{font-size:108px}
  .k-cover .body{font-weight:600;opacity:.95}

  /* Foto a sangre (detalle de producto) */
  .k-photo .photo{inset:0;background:transparent}
  .k-photo .text{position:absolute;left:90px;right:90px}
  .fmt-story.k-photo .text{bottom:400px}
  .fmt-post.k-photo .text{bottom:100px}
  .k-photo .title{font-size:76px}

  /* Producto individual / paso */
  .k-prod1 .photo,.k-step .photo{left:140px;right:140px}
  .k-prod1 .text,.k-step .text{position:absolute;left:140px;right:140px}
  .fmt-story.k-prod1 .photo{top:300px;height:1000px}
  .fmt-story.k-prod1 .text{top:1345px}
  .fmt-post.k-prod1 .photo,.fmt-post.k-step .photo{left:200px;right:200px;top:90px;height:850px}
  .fmt-post.k-prod1 .text,.fmt-post.k-step .text{left:200px;right:200px;top:985px}
  .k-prod1 .title{font-size:88px;margin-bottom:14px}
  .fmt-post.k-prod1 .title{font-size:68px;margin-bottom:10px}
  .fmt-post .price{font-size:38px}
  .fmt-story.k-step .photo{top:300px;height:880px}
  .fmt-story.k-step .text{top:1225px}
  .fmt-post.k-step .photo{height:740px}
  .fmt-post.k-step .text{top:870px}
  .k-step .title{font-size:80px;margin-bottom:18px}
  .fmt-post.k-step .title{font-size:62px;margin-bottom:12px}
  .fmt-post.k-step .body{font-size:32px}

  /* Dos productos */
  .fmt-story.k-prod2 .row{position:absolute;left:90px;right:90px;height:560px;display:flex;gap:50px;align-items:flex-end}
  .fmt-story.k-prod2 .r1{top:340px}
  .fmt-story.k-prod2 .r2{top:960px}
  .fmt-story.k-prod2 .photo{position:relative;width:460px;height:560px;flex:none}
  .k-prod2 .info{flex:1;padding-bottom:10px}
  .k-prod2 .num{font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--oak);margin-bottom:18px;font-weight:500}
  .tone-dark .num{color:inherit;opacity:.72}
  .k-prod2 .name{font-family:var(--serif);font-size:68px;line-height:1.1;margin-bottom:18px}
  .k-prod2 .price{font-size:38px}
  .fmt-post.k-prod2 .head{position:absolute;left:80px;right:80px;top:96px}
  .fmt-post.k-prod2 .cols{position:absolute;left:80px;right:80px;top:200px;display:flex;gap:40px}
  .fmt-post.k-prod2 .col{width:440px}
  .fmt-post.k-prod2 .photo{position:relative;width:440px;height:550px}
  .fmt-post.k-prod2 .info{padding-top:30px}
  .fmt-post.k-prod2 .name{font-size:50px;margin-bottom:12px}
  .fmt-post.k-prod2 .num{margin-bottom:12px}
  .fmt-post.k-prod2 .price{font-size:32px}

  /* Texto */
  .k-text .center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 110px}
  .k-text .title{font-size:112px;margin-bottom:36px}
  .fmt-post.k-text .title{font-size:92px}
  .fmt-post.k-text .body{font-size:34px}

  /* Ficha */
  .k-specs .head{position:absolute;left:90px;right:90px}
  .k-specs .list{position:absolute;left:90px;right:90px}
  .fmt-story.k-specs .head{top:330px}
  .fmt-story.k-specs .list{top:700px}
  .fmt-post.k-specs .head{top:100px;left:80px;right:80px}
  .fmt-post.k-specs .list{top:380px;left:80px;right:80px}
  .k-specs .title{font-size:100px}
  .fmt-post.k-specs .title{font-size:80px}
  .spec{display:flex;gap:40px;padding:34px 0;border-top:2px solid rgba(42,38,32,.15)}
  .spec:last-child{border-bottom:2px solid rgba(42,38,32,.15)}
  .spec .lab{width:250px;flex:none;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--oak);padding-top:10px;font-weight:500}
  .spec .val{font-size:40px;line-height:1.4}
  .fmt-post .spec{padding:26px 0}
  .fmt-post .spec .val{font-size:34px}
  .k-specs .desc{margin-top:44px}
  .fmt-post.k-specs .desc{font-size:32px;margin-top:30px}

  /* Medios de pago */
  .k-pay .head{position:absolute;left:90px;right:90px}
  .k-pay .offers{position:absolute;left:90px;right:90px}
  .fmt-story.k-pay .head{top:330px}
  .fmt-story.k-pay .offers{top:690px}
  .fmt-post.k-pay .head{top:100px;left:80px;right:80px}
  .fmt-post.k-pay .offers{top:390px;left:80px;right:80px}
  .k-pay .title{font-size:100px}
  .fmt-post.k-pay .title{font-size:84px}
  .offer{display:flex;align-items:center;gap:50px;height:210px;border-top:2px solid rgba(42,38,32,.15)}
  .offer:last-child{border-bottom:2px solid rgba(42,38,32,.15)}
  .fmt-post .offer{height:180px}
  .offer .big{font-family:var(--serif);font-size:150px;line-height:1;color:var(--oak);width:300px;flex:none;letter-spacing:-.02em}
  .fmt-post .offer .big{font-size:124px;width:260px}
  .offer .desc{font-size:42px;line-height:1.35;max-width:600px}
  .tone-dark .offer .big{color:inherit}
  .tone-dark .offer,.tone-dark .spec,.tone-dark .ship{border-color:rgba(255,255,255,.22)!important}

  /* Envíos */
  .k-ship .head{position:absolute;left:90px;right:90px}
  .k-ship .opts{position:absolute;left:90px;right:90px}
  .fmt-story.k-ship .head{top:330px}
  .fmt-story.k-ship .opts{top:690px}
  .fmt-post.k-ship .head{top:100px;left:80px;right:80px}
  .fmt-post.k-ship .opts{top:370px;left:80px;right:80px}
  .k-ship .title{font-size:100px}
  .fmt-post.k-ship .title{font-size:84px}
  .ship{padding:38px 0;border-top:2px solid rgba(42,38,32,.15)}
  .ship:last-of-type{border-bottom:2px solid rgba(42,38,32,.15)}
  .ship .sname{font-family:var(--serif);font-size:62px;line-height:1.1}
  .ship .stime{font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--oak);margin-top:14px;font-weight:500}
  .tone-dark .ship .stime{color:inherit;opacity:.75}
  .ship .sdet{font-size:34px;line-height:1.4;opacity:.8;margin-top:8px}
  .fmt-post .ship{padding:26px 0}
  .fmt-post .ship .sname{font-size:50px}
  .fmt-post .ship .stime{font-size:26px;margin-top:10px}
  .fmt-post .ship .sdet{font-size:30px}
  .k-ship .note{margin-top:40px;font-size:32px;line-height:1.45;opacity:.75}
  .fmt-post.k-ship .note{margin-top:28px;font-size:28px}
  .fmt-post .offer .desc{font-size:36px}

  /* Cierre */
  .k-close .center{position:absolute;left:90px;right:90px;text-align:center}
  .fmt-story.k-close .center{top:560px}
  .fmt-post.k-close .center{top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:110px}
  .k-close .url{font-family:var(--serif);font-size:118px;line-height:1.05;letter-spacing:-.01em;margin-bottom:34px}
  .fmt-post.k-close .url{font-size:104px}
  .k-close .body{max-width:780px;margin:0 auto}
  .k-close .cta{display:inline-block;margin-top:56px;background:#fff;color:var(--ink);font-size:34px;letter-spacing:.04em;padding:28px 54px;border-radius:4px}
  .sticker-zone{position:absolute;left:190px;right:190px;top:1150px;height:300px;border:4px dashed currentColor;border-radius:30px;opacity:.45;display:flex;align-items:center;justify-content:center;text-align:center;font-size:32px;line-height:1.4;padding:30px}

  /* Guías de zonas seguras (solo historia) */
  .guides .g{position:absolute;left:0;right:0;background:rgba(255,0,80,.13);border:2px dashed rgba(255,0,80,.5);pointer-events:none;display:none;font:500 26px var(--sans);color:rgba(255,0,80,.85);padding:16px;z-index:5}
  .show-guides .guides .g{display:block}
  .g.t{top:0;height:250px}
  .g.b{bottom:0;height:340px}
</style>
</head>
<body>

const isLocalFile = location.protocol === 'file:';
function imgURL(raw){
  if (!raw || raw.startsWith('data:') || raw.startsWith('blob:')) return raw;
  if (isLocalFile) return raw;                          // abierto como archivo: intento directo
  return '/api/img?url=' + encodeURIComponent(raw);     // publicado: proxy del mismo dominio
}

/* =========================================================
   Fotos: carga, recorte con canvas (sin deformar) y encuadre
   ========================================================= */
const imgPromises = new Map(), loaded = new Map(), cropCache = new Map();
function loadImg(src){
  if (!imgPromises.has(src)) imgPromises.set(src, new Promise((res, rej) => {
    const i = new Image();
    if (!src.startsWith('data:')) i.crossOrigin = 'anonymous';
    i.onload = () => { loaded.set(src, i); res(i); };
    i.onerror = rej; i.src = src;
  }));
  return imgPromises.get(src);
}
function cropTo(img, W, H, fr){
  const scale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const sw = W / scale, sh = H / scale;
  const sx = (img.naturalWidth - sw) * fr.fx, sy = (img.naturalHeight - sh) * fr.fy;
  const k = Math.min(2, Math.max(1, 1 / scale));
  const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k);
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .9);
}
function drawPhoto(el, img, useCache = true){
  const key = el.dataset.key, fr = S.framing[key] || { fx:.5, fy:.5 };
  const W = el.offsetWidth, H = el.offsetHeight; if (!W || !H) return;
  const ck = `${img.src}|${W}|${H}|${fr.fx.toFixed(3)}|${fr.fy.toFixed(3)}`;
  let url = useCache && cropCache.get(ck);
  if (!url) {
    try { url = cropTo(img, W, H, fr); }
    catch(_) { // la imagen no permite recorte (CORS): se muestra igual pero avisamos
      url = img.src; el.dataset.tainted = '1';
    }
    if (useCache) { cropCache.set(ck, url); if (cropCache.size > 120) cropCache.delete(cropCache.keys().next().value); }
  }
  let o = el.querySelector('img');
  if (!o) { o = document.createElement('img'); o.draggable = false; el.prepend(o); }
  o.src = url;
  if (el.dataset.tainted) o.style.objectFit = 'cover';
}
function fillPhotos(root){
  root.querySelectorAll('.photo[data-src]').forEach(el => {
    const raw = el.dataset.src; if (!raw) return;
    const src = imgURL(raw);
    const ready = loaded.get(src);
    if (ready) return drawPhoto(el, ready);
    loadImg(src).then(img => drawPhoto(el, img)).catch(() => {
      el.classList.remove('has'); el.querySelector('.hint').textContent = 'No se pudo cargar la foto';
    });
  });
}
function downscale(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const i = new Image(); i.onload = () => {
      const m = 1800, s = Math.min(1, m / Math.max(i.naturalWidth, i.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(i.naturalWidth * s); c.height = Math.round(i.naturalHeight * s);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .9));
    }; i.onerror = rej; i.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
let uploadKey = null;
function askUpload(key){ uploadKey = key; const f = $('#file'); f.value = ''; f.click(); }
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f || !uploadKey) return;
  setPhoto(uploadKey, await downscale(f));
});
function setPhoto(key, url){
  const [k, a] = key.split(':');
  if (k === 'cover') S.cover.src = url;
  else if (k === 'p') { const p = allProducts().find(p => p.id === a); if (p) p.upload = url; }
  else if (k === 'cat') { const c = S.cats.find(c => c.id === a); if (c) c.src = url; }
  else if (k === 'img') S.product.images[+a].src = url;
  else if (k === 'imgadd') S.product.images.push({ src:url, use:true, caption:'' });
  else if (k === 'step') S.steps[+a].src = url;

}

    if (m.product) {

/* =========================================================
   Tienda (Shopify, vía /api)
   ========================================================= */
function shopMsg(t, cls = ''){ const m = $('#shopMsg'); if (m) { m.textContent = t; m.className = 'msg ' + cls; } }
async function api(params){
  if (isLocalFile) throw new Error('La carga desde la tienda funciona cuando la herramienta está publicada en Vercel.');
  const r = await fetch('/api/shopify?' + new URLSearchParams(params));
  let j = null; try { j = await r.json(); } catch(_) {}
  if (!r.ok) throw new Error((j && j.error) || 'No se pudo leer la tienda.');
  return j;
}
function parseShop(raw){
  const s = String(raw || '').trim(); if (!s) return null;
  const pm = s.match(/\/products\/([^/?#\s]+)/), cm = s.match(/\/collections\/([^/?#\s]+)/);
  if (pm) return { product: decodeURIComponent(pm[1]) };
  if (cm) return { collection: decodeURIComponent(cm[1]) };
  if (/^[\w-]+$/.test(s)) return APP.type === 'producto' ? { product:s } : { collection:s };
  return null;
}
function toItem(p){
  return { id:p.id, name:p.title, price:money(p.price), compare:p.compareAt && p.compareAt > p.price ? money(p.compareAt) : '',
           soldOut:!p.available, show:p.available, images:p.images, imgIndex:0, upload:'' };
}
function commonPrefix(names){
  if (names.length < 2) return '';
  const w = names[0].split(' ')[0];
  return names.every(n => n.split(' ')[0].toLowerCase() === w.toLowerCase()) && w.length > 2 ? w : '';
}
function applyProduct(p){
  const lines = (p.description || '').split('\n').map(l => l.trim()).filter(Boolean);
  let materials = '', measures = ''; const rest = [];
  lines.forEach(l => {
    const m1 = l.match(/^(materiales?|madera|material)\s*[:\-–]\s*(.+)$/i);
    const m2 = l.match(/^(medidas?|dimensiones?|tamaño)\s*[:\-–]\s*(.+)$/i);
    if (m1) materials += (materials ? '\n' : '') + m1[2];
    else if (m2) measures += (measures ? '\n' : '') + m2[2];
    else rest.push(l);
  });
  let desc = rest.join(' '); if (desc.length > 220) desc = desc.slice(0, 217).replace(/\s+\S*$/, '') + '…';
  S.product = { name:p.title, price:money(p.price), compare:p.compareAt && p.compareAt > p.price ? money(p.compareAt) : '',
                materials, measures, desc, specsOn:true, images:p.images.map((src, i) => ({ src, use:i > 0 && i <= 4, caption:'' })) };
  S.cover.title = p.title; S.cover.src = p.images[0] || ''; S.framing = {};
}
async function shopLoad(){
  const m = parseShop(S.shopUrl);
  if (!m) return shopMsg('Pegá el link de una colección (…/collections/…) o de un producto (…/products/…).', 'err');
  if (APP.type === 'producto' && !m.product) return shopMsg('Para esta plantilla pegá el link de un producto (…/products/…).', 'err');
  if (APP.type === 'coleccion' && !m.collection) return shopMsg('Para esta plantilla pegá el link de una colección (…/collections/…).', 'err');
  shopMsg('Cargando…');
  try {
    if (APP.type === 'producto') {
      const d = await api({ type:'product', handle:m.product });
      applyProduct(d.product);
      shopMsg(`Listo: ${d.product.title} (${d.product.images.length} fotos).`, 'ok');
    } else if (m.product) {
      const d = await api({ type:'product', handle:m.product });
      if (!S.products.some(x => x.id === d.product.id)) S.products.push({ ...toItem(d.product), show:true });
      shopMsg(`Se agregó ${d.product.title}.`, 'ok');
    } else {
      const d = await api({ type:'collection', handle:m.collection });
      const items = d.products.map(toItem);
      if (APP.type === 'coleccion') {
        S.products = items; S.framing = {};
        S.cover.title = d.title; S.strip = commonPrefix(items.map(p => p.name));
        if (!S.cover.src) S.cover.src = '';
      } else {
        items.forEach(it => { if (!S.products.some(x => x.id === it.id)) S.products.push(it); });
      }
      const so = items.filter(p => p.soldOut).length;
      shopMsg(`Listo: ${d.title}, ${items.length} productos${so ? ` (${so} agotado${so > 1 ? 's' : ''}, ocultos)` : ''}.`, 'ok');
    }
    save(); const msg = $('#shopMsg').outerHTML; renderForm(); $('#shopMsg').outerHTML = msg; renderSlides();
  } catch(e) { shopMsg(e.message, 'err'); }
}
async function shopList(){
  const box = $('#colList'); box.innerHTML = '<p class="msg">Cargando colecciones…</p>';
  try {
    const d = await api({ type:'collections' });
    box.innerHTML = `<div class="f" style="margin-top:8px"><select id="colSel"><option value="">Elegí una colección…</option>${d.collections
      .sort((a, b) => a.title.localeCompare(b.title, 'es')).map(c => `<option value="${esc(c.handle)}">${esc(c.title)}${c.count != null ? ` (${c.count})` : ''}</option>`).join('')}</select></div>`;
    $('#colSel').onchange = e => { if (!e.target.value) return; S.shopUrl = `${SHOP_DOMAIN}/collections/${e.target.value}`; $('#shopUrl').value = S.shopUrl; shopLoad(); };
  } catch(e) { box.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
}

/* =========================================================
   Exportar
   ========================================================= */
async function slideCanvas(card){
  if (!window.html2canvas) throw new Error('No se pudo cargar la herramienta de exportación. Revisá la conexión a internet.');
  await document.fonts.ready;
  const src = card.querySelector('.slide'), host = $('#exportHost');
  const clone = src.cloneNode(true); clone.style.transform = 'none';
  const tp = src.querySelector('.top');
  if (tp) { const col = getComputedStyle(tp).color; clone.querySelectorAll('.logo [fill]').forEach(e => e.setAttribute('fill', col)); }
  host.appendChild(clone);
  try {
    return await html2canvas(clone, { scale:1, width:1080, height:APP.format === 'story' ? 1920 : 1350, useCORS:true, backgroundColor:null, logging:false });
  } finally { host.removeChild(clone); }
}
const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
function fileBase(){
  const t = (S.cover && S.cover.title) || TYPES[APP.type].name;
  const slug = t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  return `la-ferme-${APP.format === 'story' ? 'historia' : 'post'}-${slug || APP.type}`;
}
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
async function dlOne(i){
  const card = document.querySelectorAll('#slides .card')[i];
  try { download(await toBlob(await slideCanvas(card)), `${fileBase()}-${pad(i + 1)}.png`); }
  catch(e) { alertMsg(e.message); }
}
async function dlAll(){
  const btn = $('#dlAll'), cards = [...document.querySelectorAll('#slides .card')];
  btn.disabled = true;
  try {
    if (window.JSZip) {
      const zip = new JSZip();
      for (let i = 0; i < cards.length; i++) {
        btn.textContent = `Preparando ${i + 1} de ${cards.length}…`;
        zip.file(`${fileBase()}-${pad(i + 1)}.png`, await toBlob(await slideCanvas(cards[i])));
      }
      download(await zip.generateAsync({ type:'blob' }), `${fileBase()}.zip`);
    } else {
      for (let i = 0; i < cards.length; i++) { await dlOne(i); await new Promise(r => setTimeout(r, 400)); }
    }
  } catch(e) { alertMsg(e.message); }
  btn.disabled = false; btn.textContent = 'Descargar todo (.zip)';
}
function alertMsg(t){ const h = document.querySelector('.stagebar .hint'); if (h) { h.textContent = t; h.style.color = '#a3392f'; } }

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.path || !S) return;
  setPath(S, el.dataset.path, el.type === 'checkbox' ? el.checked : el.value);
  if ('rerender' in el.dataset) renderForm();
  save(); renderSlidesSoon();
});
function liveBg(id, color){
  const sl = document.querySelector(`.slide[data-id="${CSS.escape(id)}"]`); if (!sl) return;
  sl.style.background = color;
  const dark = sl.dataset.full === '1' || isDark(color);
  sl.classList.toggle('tone-dark', dark); sl.classList.toggle('tone-light', !dark);
}
document.addEventListener('input', e => { const id = e.target.dataset && e.target.dataset.bgid; if (id) liveBg(id, e.target.value); });
document.addEventListener('change', e => { const id = e.target.dataset && e.target.dataset.bgid; if (id) { S.bg[id] = e.target.value; save(); renderSlides(); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.cat') && S.cats) S.cats[+d.dataset.cat]._open = d.open; }, true);
document.addEventListener('keydown', e => { if (e.key !== 'Enter') return; if (e.target.id === 'shopUrl') shopLoad(); const m = (e.target.id || '').match(/^catUrl(\d+)$/); if (m) catLoad(+m[1]); });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  // fotos dentro de la vista previa
  if (!b) {
    const chg = e.target.closest('.slide .chg'), ph = e.target.closest('.slide .photo');
    if (chg) askUpload(chg.closest('.photo').dataset.key);
    else if (ph && !ph.classList.contains('has')) askUpload(ph.dataset.key);
    return;
  }
  if (b.closest('summary')) e.preventDefault();
  const a = b.dataset.act, i = +b.dataset.i;
  switch (a) {
    case 'home': go(null); break;
    case 'open': go(b.dataset.t); break;
    case 'fmt': APP.format = b.dataset.f; save(); APP.type ? renderEditor() : renderHome(); break;
    case 'zoom': {
      const st = $('#stage'), s = parseFloat(getComputedStyle(st).getPropertyValue('--s'));
      const v = Math.min(.6, Math.max(.16, s + .04 * +b.dataset.d)); st.style.setProperty('--s', v);
      APP.zoom = { ...(APP.zoom || {}), [APP.format]: v }; save(); fillPhotos($('#slides')); break; }
    case 'upload': askUpload(b.dataset.key); break;
    case 'cover-pick': S.cover.src = b.dataset.src; delete S.framing.cover; save(); renderForm(); renderSlides(); break;
    case 'cover-clear': S.cover.src = ''; save(); renderForm(); renderSlides(); break;
    case 'per': S.perSlide = +b.dataset.n; save(); renderForm(); renderSlides(); break;
    case 'all': plist(b.dataset.c).forEach(p => p.show = b.dataset.v === '1'); save(); renderForm(); renderSlides(); break;
    case 'prod-add': plist(b.dataset.c).push({ id:'m' + Date.now(), name:'Nuevo producto', price:'', compare:'', soldOut:false, show:true, images:[], imgIndex:0, upload:'' }); save(); renderForm(); renderSlides(); break;
    case 'prod-del': plist(b.dataset.c).splice(i, 1); save(); renderForm(); renderSlides(); break;
    case 'prod-move': { const L = plist(b.dataset.c), j = i + +b.dataset.d; if (j < 0 || j >= L.length) break;
      [L[i], L[j]] = [L[j], L[i]]; save(); renderForm(); renderSlides(); break; }
    case 'prod-cycle': { const p = plist(b.dataset.c)[i]; if (!p.images || p.images.length < 2 || p.upload) break;
      p.imgIndex = ((p.imgIndex || 0) + 1) % p.images.length; delete S.framing['p:' + p.id]; save(); renderForm(); renderSlides(); break; }
    case 'img-del': { const im = S.product.images[i]; if (im.src === S.cover.src) S.cover.src = ''; S.product.images.splice(i, 1); S.framing = {}; save(); renderForm(); renderSlides(); break; }
    case 'step-add': S.steps.push({ title:'Nuevo paso', body:'', src:'' }); save(); renderForm(); renderSlides(); break;
    case 'step-del': S.steps.splice(i, 1); S.framing = {}; save(); renderForm(); renderSlides(); break;
    case 'cat-add': S.cats.push(newCat('Nueva categoría')); save(); renderForm(); renderSlides(); break;
    case 'cat-del': if (!S.cats[i].products.length || confirm(`¿Quitar la categoría ${S.cats[i].name} y sus productos?`)) { S.cats.splice(i, 1); save(); renderForm(); renderSlides(); } break;
    case 'cat-move': { const j = i + +b.dataset.d; if (j < 0 || j >= S.cats.length) break;
      [S.cats[i], S.cats[j]] = [S.cats[j], S.cats[i]]; save(); renderForm(); renderSlides(); break; }
    case 'cat-load': catLoad(i); break;
    case 'cat-list': catList(i); break;
    case 'cat-pick': S.cats[i].src = b.dataset.src; delete S.framing['cat:' + S.cats[i].id]; save(); renderForm(); renderSlides(); break;
    case 'cat-clear': S.cats[i].src = ''; save(); renderForm(); renderSlides(); break;
    case 'ship-add': S[b.dataset.k].options.push({ name:'', time:'', detail:'' }); save(); renderForm(); renderSlides(); break;
    case 'ship-del': S[b.dataset.k].options.splice(i, 1); save(); renderForm(); renderSlides(); break;
    case 'ship-move': { const o = S[b.dataset.k].options, j = i + +b.dataset.d; if (j < 0 || j >= o.length) break;
      [o[i], o[j]] = [o[j], o[i]]; save(); renderForm(); renderSlides(); break; }
    case 'bg': S.bg[b.dataset.id] = b.dataset.c; save(); renderSlides(); break;
    case 'bg-reset': delete S.bg[b.dataset.id]; save(); renderSlides(); break;
    case 'offer-add': S.payments.offers.push({ big:'', desc:'' }); save(); renderForm(); renderSlides(); break;
    case 'offer-del': S.payments.offers.splice(i, 1); save(); renderForm(); renderSlides(); break;
    case 'shop-load': shopLoad(); break;
    case 'shop-list': shopList(); break;
    case 'reset': if (confirm('¿Borrar todo lo cargado en esta plantilla?')) { APP.states[APP.type] = defaults(APP.type); S = APP.states[APP.type]; save(); renderEditor(); } break;
    case 'dl': dlOne(i); break;
    case 'dl-all': dlAll(); break;
  }
});

// Arrastrar para encuadrar
let drag = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.slide .photo.has'); if (!el || e.target.closest('.chg')) return;
  const img = loaded.get(imgURL(el.dataset.src)); if (!img) return;
  const fr = S.framing[el.dataset.key] || { fx:.5, fy:.5 };
  drag = { el, img, x:e.clientX, y:e.clientY, fx:fr.fx, fy:fr.fy };
  el.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const { el, img } = drag, W = el.offsetWidth, H = el.offsetHeight;
  const sc = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const ex = img.naturalWidth * sc - W, ey = img.naturalHeight * sc - H;
  const z = el.getBoundingClientRect().width / W;
  const dx = (e.clientX - drag.x) / z, dy = (e.clientY - drag.y) / z;
  S.framing[el.dataset.key] = { fx: ex > 0 ? clamp(drag.fx - dx / ex) : .5, fy: ey > 0 ? clamp(drag.fy - dy / ey) : .5 };
  drawPhoto(el, img, false);
});
const endDrag = () => { if (drag) { drawPhoto(drag.el, drag.img); drag = null; save(); } };
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

route();
</script>
