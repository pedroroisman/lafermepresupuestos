<style>
  :root{
    --white:#fff; --light:#F3F2EF; --offwhite:#F8F8F6; --ink:#2A2620; --oak:#8B6B4A;
    --line:#E3E1DC; --muted:#7A746B; --err:#a3392f; --ok:#4f6b3c;
    --serif:"Libre Caslon Text",Georgia,serif; --sans:"Instrument Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--offwhite);font-size:14px}
  button{font:inherit;cursor:pointer;color:inherit}
  input,textarea,select{font:inherit;color:inherit}
  .bar{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:30}
  .bar .brand{display:flex;align-items:center;gap:14px}
  .bar .brand svg{width:132px;height:auto;display:block}
  .bar .crumb{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
  .bar a{color:var(--muted);font-size:13px;text-decoration:none}
  .bar a:hover{color:var(--ink)}
  .btn{border:1px solid var(--ink);background:#fff;padding:9px 16px;border-radius:4px;font-weight:500;white-space:nowrap}
  .btn:hover{background:var(--light)}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.dark:hover{background:#000}
  .btn.ghost{border-color:var(--line)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .editor{display:grid;grid-template-columns:460px 1fr;height:calc(100vh - 64px)}
  .side{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:4px 20px 80px}
  .stage{background:#E9E7E2;display:flex;flex-direction:column;min-height:0}
  .stagebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 22px}
  .stagebar .hint{color:var(--muted);font-size:12px}
  .preview{flex:1;min-height:0;padding:0 22px 22px}
  .preview iframe{width:100%;height:100%;border:0;border-radius:6px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12)}
  .sec{border-bottom:1px solid var(--line);padding:18px 0}
  .sec h3{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sec h3 .count{font-weight:500;letter-spacing:0;text-transform:none}
  .f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0;flex:1}
  .f label{font-size:12px;color:var(--muted)}
  .in,.f input[type=text],.f input[type=number],.f textarea,.f select{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:#fff;width:100%}
  .f textarea{resize:vertical;min-height:58px;line-height:1.4}
  .in:focus,.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid rgba(139,107,74,.35);border-color:var(--oak)}
  .row2{display:flex;gap:10px}
  .tog{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
  .help{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
  .msg{font-size:12px;margin-top:8px;line-height:1.4;color:var(--muted)}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .paste{min-height:150px!important;font-family:ui-monospace,Menlo,monospace;font-size:12px!important}
  .item{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;background:#fff}
  .item .ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .item .ihead strong{font-weight:600;font-size:13px}
  .icon{border:0;background:none;min-width:24px;height:24px;border-radius:3px;color:var(--muted);font-size:13px;padding:0 5px}
  .icon:hover{background:var(--light);color:var(--ink)}
  .photo{display:flex;gap:10px;align-items:center;margin-top:4px}
  .th{width:58px;height:58px;border-radius:4px;background:var(--light) center/cover no-repeat;flex:none;position:relative;border:1px solid var(--line)}
  .th.cyc{cursor:pointer}
  .th .n{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:0 4px;border-radius:3px}
  .search{margin-top:10px;padding:10px;background:var(--offwhite);border-radius:6px;border:1px solid var(--line)}
  .results{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .res{border:1px solid var(--line);border-radius:4px;background:#fff;padding:4px;text-align:left;font-size:11px;line-height:1.25}
  .res:hover{border-color:var(--ink)}
  .res i{display:block;aspect-ratio:1;background:var(--light) center/cover no-repeat;border-radius:3px;margin-bottom:4px}
  .cond{display:grid;grid-template-columns:130px 1fr auto;gap:6px;align-items:start;margin-bottom:6px}
  .cond textarea{min-height:36px!important}
  .totals .trow{display:grid;grid-template-columns:auto 1fr 70px auto;gap:8px;align-items:center;margin-bottom:6px}
  .summary{background:var(--light);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.7;margin-top:8px}
  .summary b{font-weight:600}
  details.cfg summary{cursor:pointer;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);list-style:none}
  details.cfg summary::-webkit-details-marker{display:none}
  details.cfg summary::before{content:'› ';display:inline-block;transition:transform .15s}
  details.cfg[open] summary::before{transform:rotate(90deg)}
  .branch{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .hist{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
  .hist span{color:var(--muted);font-size:12px}
  @media (max-width:900px){
    .editor{grid-template-columns:1fr;height:auto}
    .side{border-right:0;border-bottom:1px solid var(--line)}
    .preview{height:80vh}
    .bar .crumb{display:none}
  }
</style>
</head>

function parseNum(s){
  s = String(s ?? '').replace(/[^\d.,-]/g, ''); if (!s) return 0;
  const hasDot = s.includes('.'), hasComma = s.includes(',');
  if (hasDot && hasComma) {
    const dec = s.lastIndexOf('.') > s.lastIndexOf(',') ? '.' : ',';
    s = dec === '.' ? s.replace(/,/g, '') : s.replace(/\./g, '').replace(',', '.');
  } else if (hasDot || hasComma) {
    const sep = hasDot ? '.' : ',', parts = s.split(sep);
    const thousands = parts.length > 2 || (parts.length === 2 && parts[1].length === 3);
    s = thousands ? parts.join('') : parts.join('.');
  }
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}

const LABELS = {
  'fecha':'date', 'num':'num', 'numero':'num', 'nro':'num', 'n°':'num', 'nº':'num',
  'cliente':'client', 'view ref (cliente)':'_skip', 'presupuesto':'ref',
  'descripcion producto':'desc', 'descripcion':'desc', 'producto':'desc',
  'precio final':'price', 'precio':'price', 'precio unitario':'price', 'total':'price',
  'cantidad':'qty', 'cant':'qty', 'estado':'status', 'ambiente':'ambiente',
};
const labelOf = l => LABELS[norm(l).replace(/:$/, '')];
function parsePaste(text){
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const records = [];
  // Caso tabla: primera fila con encabezados separados por tabulaciones
  const first = lines.find(l => l.trim());
  if (first && first.includes('\t')) {
    const heads = first.split('\t').map(labelOf);
    if (heads.filter(Boolean).length >= 2) {
      lines.slice(lines.indexOf(first) + 1).filter(l => l.trim()).forEach(l => {
        const r = {}; l.split('\t').forEach((v, k) => { const h = heads[k]; if (h && h !== '_skip' && v.trim()) r[h] = v.trim(); });
        if (Object.keys(r).length) records.push(r);
      });
      return records;
    }
  }
  // Caso lista: "Etiqueta" en una línea y el valor en la(s) siguiente(s), o "Etiqueta: valor"
  let r = {}, cur = null;
  const push = () => { if (Object.keys(r).length) records.push(r); r = {}; cur = null; };
  for (const raw of lines) {
    const line = raw.trim(); if (!line) continue;
    let key = labelOf(line), val = '';
    if (!key) {
      const m = line.match(/^([^:\t]{2,30})[:\t]\s*(.+)$/);
      if (m && labelOf(m[1])) { key = labelOf(m[1]); val = m[2].trim(); }
    }
    if (key) {
      if (key === 'date' && r.date) push();
      cur = key;
      if (val && key !== '_skip') r[key] = val;
      continue;
    }
    if (cur && cur !== '_skip') r[cur] = r[cur] ? r[cur] + ' ' + line : line;
  }
  push();
  return records;
}
function applyPaste(){
  const ta = $('#paste'), msg = $('#pasteMsg');
  const recs = parsePaste(ta.value);
  if (!recs.length) { msg.textContent = 'No encontré datos. Copiá el bloque completo, con las etiquetas (Fecha, Num, Cliente, Descripción producto, Precio Final).'; msg.className = 'msg err'; return; }
  let added = 0, dup = 0;
  recs.forEach(rc => {
    if (rc.date) B.date = rc.date;
    if (rc.num) B.num = String(rc.num).replace(/[^\dA-Za-z-]/g, '');
    if (rc.client) B.client = rc.client;
    if (rc.ref) B.ref = rc.ref;
    if (rc.desc || rc.price) {
      const unit = parseNum(rc.price), qty = rc.qty ? Math.max(1, parseNum(rc.qty)) : 1;
      const desc = rc.desc || (rc.ref ? rc.ref.split('—')[1]?.trim() || rc.ref : '');
      if (B.items.some(it => norm(it.desc) === norm(desc) && it.unit === unit)) { dup++; return; }
      const it = newItem({ desc, unit, qty, status: rc.status || 'A fabricar', ambiente: rc.ambiente || '' });
      B.items.push(it); added++;
      autoPhoto(it);
    }
  });
  ta.value = '';
  save(); renderForm(); refresh();
  const m2 = $('#pasteMsg');
  m2.textContent = added ? `Listo: ${added === 1 ? 'se agregó 1 producto' : `se agregaron ${added} productos`}${dup ? ` (${dup} ya estaba${dup > 1 ? 'n' : ''})` : ''}. Buscando foto en la tienda…`
                         : dup ? 'Ese producto ya estaba en el presupuesto. Se actualizaron los datos del cliente.' : 'Se actualizaron los datos del presupuesto.';
  m2.className = 'msg ok';
}

/* =========================================================
   Fotos de la tienda (Shopify, vía /api)
   ========================================================= */
async function api(params){
  if (isLocalFile) throw new Error('La búsqueda en la tienda funciona cuando la herramienta está publicada en Vercel.');
  const r = await fetch('/api/shopify?' + new URLSearchParams(params));
  let j = null; try { j = await r.json(); } catch(_) {}
  if (!r.ok) throw new Error((j && j.error) || 'No se pudo leer la tienda.');
  return j;
}
function guessQuery(desc){
  const d = String(desc || '');
  const m = d.match(/modelo\s+([A-ZÁÉÍÓÚÑa-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)/i);
  if (m) return m[1];
  return d.split(/\s+/).filter(w => !/\d/.test(w)).slice(0, 3).join(' ');
}
const openSearch = {};   // id -> {q, results, msg}
async function runSearch(id, q){
  const it = B.items.find(x => x.id === id); if (!it) return;
  openSearch[id] = { q, results:[], msg:'Buscando…' }; renderForm();
  try {
    const m = q.match(/\/products\/([^/?#\s]+)/);
    if (m) { await pickProduct(id, decodeURIComponent(m[1])); return; }
    const d = await api({ type:'search', q });
    openSearch[id] = { q, results:d.products, msg: d.products.length ? '' : 'No encontré productos con ese nombre. Probá con otra palabra o pegá el link del producto.' };
  } catch(e) { openSearch[id] = { q, results:[], msg:e.message, err:true }; }
  renderForm();
}
async function pickProduct(id, handle){
  const it = B.items.find(x => x.id === id); if (!it) return;
  try {
    const d = await api({ type:'product', handle });
    it.photo = { images:d.product.images, idx:0, title:d.product.title, handle };
    delete openSearch[id];
    save(); renderForm(); refresh();
  } catch(e) { openSearch[id] = { ...(openSearch[id] || {}), msg:e.message, err:true }; renderForm(); }
}
async function autoPhoto(it){
  if (!B.photos || it.photo || isLocalFile) return;
  const q = guessQuery(it.desc); if (!q) return;
  try {
    const d = await api({ type:'search', q });
    if (d.products.length === 1 || (d.products[0] && norm(it.desc).includes(norm(d.products[0].title.replace(/^(mesa|silla|sillon|sillón|lampara|lámpara)\s+/i, ''))))) {
      await pickProduct(it.id, d.products[0].handle);
      const m = $('#pasteMsg'); if (m) { m.textContent = `Se agregó con la foto de "${d.products[0].title}". Si no es la correcta, cambiala desde el producto.`; m.className = 'msg ok'; }
    } else if (d.products.length) {
      openSearch[it.id] = { q, results:d.products, msg:'Elegí la foto del producto:' }; renderForm();
      const m = $('#pasteMsg'); if (m) { m.textContent = 'Producto agregado. Elegí su foto entre los resultados de la tienda.'; m.className = 'msg ok'; }
    } else {
      const m = $('#pasteMsg'); if (m) { m.textContent = 'Producto agregado. No encontré una foto automática; podés buscarla desde el producto.'; m.className = 'msg'; }
    }
  } catch(_) {}
}

let uploadFor = null;
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f || !uploadFor) return;
  const r = new FileReader();
  r.onload = () => { const i = new Image(); i.onload = () => {
    const s = Math.min(1, 1200 / Math.max(i.naturalWidth, i.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(i.naturalWidth * s); c.height = Math.round(i.naturalHeight * s);
    c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
    const it = B.items.find(x => x.id === uploadFor); if (!it) return;
    it.photo = { ...(it.photo || {}), upload:c.toDataURL('image/jpeg', .88) };
    save(); renderForm(); refresh();
  }; i.src = r.result; };
  r.readAsDataURL(f);
});

/* =========================================================
   Cálculos
   ========================================================= */
function calc(){
  const lines = B.items.map(it => ({ it, total:(+it.qty || 0) * (+it.unit || 0) }));
  const subtotal = lines.reduce((a, l) => a + l.total, 0);
  const fab = lines.filter(l => norm(l.it.status) === 'a fabricar').reduce((a, l) => a + l.total, 0);
  const dBase = B.discountBase === 'todo' ? subtotal : fab;
  const discounts = B.discounts.filter(d => d.on && +d.pct > 0 && dBase > 0).map(d => ({ ...d, amount:dBase * d.pct / 100, total:subtotal - dBase * d.pct / 100 }));
  const depBase = B.deposit.base === 'todo' ? subtotal : fab;
  const deposit = B.deposit.on && depBase > 0 ? depBase * B.deposit.pct / 100 : 0;
  return { lines, subtotal, fab, dBase, discounts, deposit, depBase };
}

const C = { ink:[42,38,32], muted:[122,116,107], oak:[139,107,74], line:[227,225,220], light:[243,242,239] };
let FONTS = null;
async function loadFonts(){
  if (FONTS !== null) return FONTS;
  try {
    const files = { serif:'fonts/LibreCaslonText-Regular.ttf', sans:'fonts/InstrumentSans-Regular.ttf', sansB:'fonts/InstrumentSans-SemiBold.ttf' };
    const out = {};
    for (const [k, u] of Object.entries(files)) {
      const buf = await (await fetch(u)).arrayBuffer();
      let bin = ''; const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      out[k] = btoa(bin);
    }
    FONTS = out;
  } catch(_) { FONTS = false; }   // sin tipografías propias: usa Helvetica / Times
  return FONTS;
}
const thumbCache = new Map();
function thumb(src){   // recorte "cover" a 11:10 para la celda de la tabla
  if (!thumbCache.has(src)) thumbCache.set(src, new Promise(res => {
    const i = new Image(); if (!src.startsWith('data:')) i.crossOrigin = 'anonymous';
    i.onload = () => {
      try {
        const W = 440, H = 400, sc = Math.max(W / i.naturalWidth, H / i.naturalHeight);
        const sw = W / sc, sh = H / sc;
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
        g.drawImage(i, (i.naturalWidth - sw) / 2, (i.naturalHeight - sh) / 2, sw, sh, 0, 0, W, H);
        res(c.toDataURL('image/jpeg', .86));
      } catch(_) { res(null); }
    };
    i.onerror = () => res(null); i.src = imgURL(src);
  }));
  return thumbCache.get(src);
}

async function buildPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4', compress:true });
  const F = await loadFonts();
  let SERIF = 'times', SANS = 'helvetica';
  if (F) {
    doc.addFileToVFS('Caslon.ttf', F.serif); doc.addFont('Caslon.ttf', 'Caslon', 'normal');
    doc.addFileToVFS('Sans.ttf', F.sans); doc.addFont('Sans.ttf', 'Sans', 'normal');
    doc.addFileToVFS('SansB.ttf', F.sansB); doc.addFont('SansB.ttf', 'Sans', 'bold');
    SERIF = 'Caslon'; SANS = 'Sans';
  }
  const W = 210, H = 297, M = 16, st = APP.settings, br = st.branches[B.branch] || st.branches[0] || {};
  const K = calc();
  const font = (f, s, style = 'normal', col = C.ink) => { doc.setFont(f, style); doc.setFontSize(s); doc.setTextColor(...col); };

  // ---------- Encabezado ----------
  doc.addImage(LOGO_PNG, 'PNG', M, 15, 46, 46 * LOGO_RATIO);
  font(SANS, 8.5, 'bold'); doc.text(st.tagline || '', M, 29);
  font(SANS, 8.5, 'normal', C.muted);
  let y = 34.5;
  [br.address, [br.email, br.phone].filter(Boolean).join(' · ')].filter(Boolean).forEach(t => { doc.text(t, M, y); y += 4.4; });
  font(SERIF, 22); doc.text('Presupuesto', W - M, 22, { align:'right' });
  font(SANS, 9.5, 'bold'); if (B.num) doc.text(`N° ${B.num}`, W - M, 29, { align:'right' });
  font(SANS, 9, 'normal', C.muted); if (B.date) doc.text(`Fecha: ${B.date}`, W - M, 34.5, { align:'right' });
  doc.setDrawColor(...C.line); doc.setLineWidth(.3); doc.line(M, 45, W - M, 45);
  font(SANS, 7.5, 'bold', C.oak); doc.text('CLIENTE', M, 52, { charSpace:.6 });
  font(SERIF, 14); doc.text(B.client || '—', M, 58.5);

  // ---------- Tabla de productos ----------
  const showPhotos = B.photos && B.items.some(it => photoSrc(it));
  const imgs = await Promise.all(B.items.map(it => showPhotos && photoSrc(it) ? thumb(photoSrc(it)) : null));
  const body = []; let lastAmb = null;
  B.items.forEach((it, k) => {
    const amb = (it.ambiente || '').trim();
    if (amb && norm(amb) !== norm(lastAmb)) {
      body.push([{ content:amb.toUpperCase(), colSpan:showPhotos ? 6 : 5, styles:{ font:SANS, fontStyle:'bold', fontSize:7.5, textColor:C.oak, cellPadding:{ top:4, bottom:1.5, left:2, right:2 }, minCellHeight:0 } }]);
    }
    lastAmb = amb || lastAmb;
    const row = [it.desc || '', String(it.qty || ''), it.unit ? money(+it.unit) : '', it.unit ? money((+it.qty || 0) * (+it.unit || 0)) : '', it.status || ''];
    if (showPhotos) row.unshift({ content:'', img:imgs[k] });
    body.push(row);
  });
  const head = ['Descripción', 'Cant.', 'Precio unitario', 'Total', 'Estado'];
  if (showPhotos) head.unshift('');
  const cs = showPhotos
    ? { 0:{ cellWidth:23, minCellHeight:20.5 }, 1:{ cellWidth:'auto' }, 2:{ cellWidth:13, halign:'center' }, 3:{ cellWidth:27, halign:'right' }, 4:{ cellWidth:27, halign:'right' }, 5:{ cellWidth:22, halign:'right' } }
    : { 0:{ cellWidth:'auto' }, 1:{ cellWidth:13, halign:'center' }, 2:{ cellWidth:29, halign:'right' }, 3:{ cellWidth:29, halign:'right' }, 4:{ cellWidth:24, halign:'right' } };
  doc.autoTable({
    startY:66, margin:{ left:M, right:M, top:22, bottom:20 }, head:[head], body, theme:'plain', columnStyles:cs, showHead:'everyPage',
    styles:{ font:SANS, fontSize:8.5, textColor:C.ink, cellPadding:{ top:2.2, bottom:2.2, left:2, right:2 }, valign:'middle', lineColor:C.line, lineWidth:{ bottom:.25 }, overflow:'linebreak' },
    headStyles:{ font:SANS, fontStyle:'bold', fontSize:7.5, textColor:C.muted, fillColor:C.light, lineWidth:0, cellPadding:{ top:3, bottom:3, left:2, right:2 } },
    didParseCell:d => {
      if (d.section === 'head' && showPhotos && d.column.index === 0) d.cell.styles.minCellHeight = 0;
      if (d.section === 'head') { const al = (cs[d.column.index] || {}).halign; if (al) d.cell.styles.halign = al; }
      if (d.section === 'body' && d.row.raw.length === 1) d.cell.styles.lineWidth = 0;
    },
    didDrawCell:d => {
      if (d.section === 'body' && showPhotos && d.column.index === 0 && d.cell.raw && d.cell.raw.img) {
        const pad = 1.4, w = d.cell.width - pad * 2, h = w * 400 / 440;
        doc.addImage(d.cell.raw.img, 'JPEG', d.cell.x + pad, d.cell.y + (d.cell.height - h) / 2, w, h);
      }
    },
  });

  // ---------- Totales ----------
  const trows = [[K.discounts.length ? 'Subtotal' : 'Total', money(K.subtotal)]];
  K.discounts.forEach(d => trows.push([`${d.label} (${d.pct}%${B.discountBase === 'todo' ? '' : ' a fabricar'})`, money(d.total)]));
  if (K.deposit) trows.push([`Seña ${B.deposit.pct}%${B.deposit.base === 'todo' ? '' : ' (a fabricar)'}`, money(K.deposit)]);
  doc.autoTable({
    startY:doc.lastAutoTable.finalY + 3, margin:{ left:W - M - 104, right:M, top:22, bottom:20 }, body:trows, theme:'plain', rowPageBreak:'avoid',
    styles:{ font:SANS, fontSize:9, textColor:C.ink, cellPadding:{ top:1.5, bottom:1.5, left:2, right:2 } },
    columnStyles:{ 0:{ cellWidth:72, textColor:C.muted }, 1:{ halign:'right', fontStyle:'bold' } },
    didParseCell:d => { if (d.row.index === 0) { d.cell.styles.fontSize = 10.5; d.cell.styles.textColor = C.ink; } },
  });

  // ---------- Observaciones ----------
  y = doc.lastAutoTable.finalY + 7;
  if (B.notes.trim()) {
    const lines = doc.splitTextToSize(B.notes.trim(), W - M * 2);
    if (y + 10 + lines.length * 4.2 > H - 22) { doc.addPage(); y = 24; }
    font(SANS, 7.5, 'bold', C.oak); doc.text('OBSERVACIONES', M, y, { charSpace:.6 });
    font(SANS, 8.5); doc.text(lines, M, y + 5.5, { lineHeightFactor:1.35 });
    y += 9 + lines.length * 4.2;
  }

  // ---------- Forma de pago y aclaraciones ----------
  const conds = B.conditions.filter(c => (c.label || '').trim() || (c.text || '').trim());
  if (conds.length) {
    doc.setFont(SANS, 'normal'); doc.setFontSize(8);
    const need = 9 + conds.reduce((a, c) => a + Math.max(1, doc.splitTextToSize(c.text || ' ', W - M * 2 - 34).length) * 3.6 + 1.6, 0);
    if (y + need > H - 20 && need < H - 50) { doc.addPage(); y = 24; }
    font(SERIF, 12); doc.text('Forma de pago y aclaraciones', M, y + 2);
    doc.autoTable({
      startY:y + 5, margin:{ left:M, right:M, top:22, bottom:20 }, theme:'plain',
      body:conds.map(c => [c.label ? c.label.replace(/:$/, '') + ':' : '', c.text || '']),
      styles:{ font:SANS, fontSize:8, textColor:C.ink, cellPadding:{ top:.8, bottom:.8, left:0, right:3 } },
      columnStyles:{ 0:{ cellWidth:34, fontStyle:'bold' }, 1:{ cellWidth:'auto' } },
    });
  }

  // ---------- Encabezado chico y pie en todas las páginas ----------
  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    doc.setPage(p);
    if (p > 1) {
      font(SANS, 8, 'normal', C.muted);
      doc.text([`Presupuesto${B.num ? ' N° ' + B.num : ''}`, B.client].filter(Boolean).join(' · '), M, 14);
      doc.addImage(LOGO_PNG, 'PNG', W - M - 28, 10.5, 28, 28 * LOGO_RATIO);
    }
    doc.setDrawColor(...C.line); doc.setLineWidth(.3); doc.line(M, H - 15, W - M, H - 15);
    font(SANS, 7.5, 'normal', C.muted);
    doc.text([st.web, br.address].filter(Boolean).join('  ·  '), M, H - 10);
    doc.text(`Página ${p} de ${n}`, W - M, H - 10, { align:'right' });
  }
  doc.setProperties({ title:fileName().replace(/\.pdf$/, ''), author:'La Ferme', creator:'La Ferme · Presupuestos' });
  return doc;
}

            ${os.msg ? `<div class="msg ${os.err ? 'err' : ''}">${esc(os.msg)}</div>` : ''}
            ${os.results && os.results.length ? `<div class="results">${os.results.map(r => `<button class="res" data-act="pick" data-id="${it.id}" data-h="${esc(r.handle)}">
              <i style="background-image:url('${esc(imgURL(r.image))}')"></i>${esc(r.title)}</button>`).join('')}</div>` : ''}
          </div>` : ''}` : ''}
      </div>`; }).join('') || '<p class="help">Pegá los datos de un producto arriba o agregalo a mano.</p>'}
    <button class="btn ghost sm" data-act="add">+ Agregar producto a mano</button>
    <div class="summary" id="sumItems">${sumItemsHTML(K)}</div></div>`;
}
const itemTitle = (it, i) => `${i + 1}. ${esc(it.desc ? it.desc.slice(0, 38) + (it.desc.length > 38 ? '…' : '') : 'Producto')}`;
function updateLive(){
  const K = calc(); const a = $('#sumItems'), b = $('#sumTotals');
  if (a) a.innerHTML = sumItemsHTML(K); if (b) b.innerHTML = sumTotalsHTML(K);
  B.items.forEach((it, i) => { const t = $('#t-' + it.id); if (t) t.innerHTML = itemTitle(it, i); });
}
function secTotals(){
  const K = calc();
  return `<div class="sec totals"><h3>Totales</h3>
    <p class="help" style="margin-bottom:8px">Precios con descuento que se muestran debajo del subtotal:</p>
    ${B.discounts.map((d, i) => `<div class="trow">
      <input type="checkbox" data-path="discounts.${i}.on" ${d.on ? 'checked' : ''}>
      <input class="in" data-path="discounts.${i}.label" value="${esc(d.label)}">
      <div class="inline" style="flex-wrap:nowrap;gap:4px"><input class="in" type="number" step="any" min="0" max="100" data-path="discounts.${i}.pct" data-num value="${esc(d.pct)}" style="width:58px">%</div>
      <button class="icon" data-act="disc-del" data-i="${i}">×</button></div>`).join('')}
    <div class="inline" style="justify-content:space-between;margin:4px 0 12px"><button class="btn ghost sm" data-act="disc-add">+ Descuento</button>
      <label class="tog" style="font-size:12px">Sobre <select class="in" data-path="discountBase" style="width:auto;padding:4px 6px">
        <option value="fabricar" ${B.discountBase !== 'todo' ? 'selected' : ''}>productos a fabricar</option><option value="todo" ${B.discountBase === 'todo' ? 'selected' : ''}>todos los productos</option></select></label></div>
    <div class="trow"><input type="checkbox" data-path="deposit.on" ${B.deposit.on ? 'checked' : ''}><span>Seña</span>
      <div class="inline" style="flex-wrap:nowrap;gap:4px"><input class="in" type="number" step="any" min="0" max="100" data-path="deposit.pct" data-num value="${esc(B.deposit.pct)}" style="width:58px">%</div><span></span></div>
    <label class="tog" style="font-size:12px;justify-content:flex-end">Sobre <select class="in" data-path="deposit.base" style="width:auto;padding:4px 6px">
      <option value="fabricar" ${B.deposit.base !== 'todo' ? 'selected' : ''}>productos a fabricar</option><option value="todo" ${B.deposit.base === 'todo' ? 'selected' : ''}>todos los productos</option></select></label>
    <div class="summary" id="sumTotals">${sumTotalsHTML(K)}</div></div>`;
}
function sumItemsHTML(K){ return `<b>Subtotal:</b> ${money(K.subtotal)}${K.fab && K.fab !== K.subtotal ? ` · <b>A fabricar:</b> ${money(K.fab)}` : ''}`; }
function sumTotalsHTML(K){
  return `${K.discounts.map(d => `${esc(d.label)}: <b>${money(d.total)}</b>`).join('<br>') || 'Sin precios con descuento.'}${K.deposit ? `<br>Seña: <b>${money(K.deposit)}</b>` : ''}
      ${!K.fab && (B.discountBase !== 'todo' || B.deposit.base !== 'todo') && B.items.length ? '<br><span style="color:var(--muted)">Ningún producto está marcado “A fabricar”, por eso no se calculan descuentos ni seña.</span>' : ''}`;
}
function secConditions(){
  return `<div class="sec"><h3>Forma de pago y aclaraciones</h3>
    ${B.conditions.map((c, i) => `<div class="cond">
      <input class="in" data-path="conditions.${i}.label" value="${esc(c.label)}" placeholder="Título">
      <textarea class="in" rows="${Math.max(1, Math.ceil((c.text || '').length / 30))}" data-path="conditions.${i}.text" placeholder="Texto">${esc(c.text)}</textarea>
      <div><button class="icon" data-act="cond-move" data-i="${i}" data-d="-1">↑</button><button class="icon" data-act="cond-del" data-i="${i}">×</button></div></div>`).join('')}
    <div class="inline" style="margin-top:6px"><button class="btn ghost sm" data-act="cond-add">+ Agregar línea</button>
      <button class="btn ghost sm" data-act="cond-save">Guardar como predeterminadas</button>
      <button class="btn ghost sm" data-act="cond-reset">Restaurar</button></div>
    <div class="msg" id="condMsg"></div>
    <div style="margin-top:14px">${fArea('Observaciones (opcional)', 'notes', B.notes, 2, 'Se imprimen antes de las condiciones')}</div></div>`;
}
function secSettings(){
  const st = APP.settings;
  return `<div class="sec"><details class="cfg"><summary>Configuración</summary>
    <div style="margin-top:12px">${fText('Frase bajo el logo', 'S:tagline', st.tagline)}${fText('Web (pie de página)', 'S:web', st.web)}
    ${st.branches.map((b, i) => `<div class="branch"><div class="inline" style="justify-content:space-between"><strong style="font-weight:600">Sucursal ${i + 1}</strong>
        ${st.branches.length > 1 ? `<button class="icon" data-act="br-del" data-i="${i}">×</button>` : ''}</div>
      <div class="row2">${fText('Nombre', `S:branches.${i}.name`, b.name)}${fText('Teléfono', `S:branches.${i}.phone`, b.phone)}</div>
      ${fText('Dirección', `S:branches.${i}.address`, b.address)}${fText('Email', `S:branches.${i}.email`, b.email)}</div>`).join('')}
    <button class="btn ghost sm" data-act="br-add" style="margin-top:8px">+ Sucursal</button>
    <p class="help" style="margin-top:10px">Estos datos se guardan para todos los presupuestos de este navegador.</p></div>
  </details></div>
  ${APP.history.length ? `<div class="sec"><h3>Descargados recientemente</h3>${APP.history.map((h, i) => `<div class="hist">
      <div>${esc(h.name)}<br><span>${new Date(h.at).toLocaleString('es-AR', { dateStyle:'short', timeStyle:'short' })}</span></div>
      <button class="btn ghost sm" data-act="open-hist" data-i="${i}">Abrir</button></div>`).join('')}</div>` : ''}`;
}
function renderForm(){
  const side = $('#side'), y = side.scrollTop;
  const focus = document.activeElement && document.activeElement.id;
  side.innerHTML = secPaste() + secHeader() + secItems() + secTotals() + secConditions() + secSettings();
  side.scrollTop = y;
  if (focus && $('#' + CSS.escape(focus))) $('#' + CSS.escape(focus)).focus();
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('input', e => {
  const el = e.target, p = el.dataset && el.dataset.path; if (!p) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if ('num' in el.dataset) v = parseNum(v);
  if ('money' in el.dataset) v = parseNum(v);
  if (p.startsWith('S:')) setPath(APP.settings, p.slice(2), v); else setPath(B, p, v);
  if ('rerender' in el.dataset) renderForm(); else updateLive();
  save(); refresh();
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset || !el.dataset.path) return;
  if (el.tagName === 'SELECT' || el.dataset.path.startsWith('S:branches')) renderForm();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('q-')) { e.preventDefault(); runSearch(e.target.id.slice(2), e.target.value.trim()); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  const rr = () => { save(); renderForm(); refresh(); };
  switch (a) {
    case 'paste': applyPaste(); break;
    case 'new':
      if (B.items.length && !confirm('¿Empezar un presupuesto nuevo? El actual se borra (si lo descargaste, queda en “Descargados recientemente”).')) break;
      APP.budget = B = newBudget(); for (const k in openSearch) delete openSearch[k]; rr(); window.scrollTo(0, 0); $('#side').scrollTop = 0; break;
    case 'download': download(); break;
    case 'open-tab': if (pvURL) window.open(pvURL, '_blank'); break;
    case 'add': B.items.push(newItem()); rr(); break;
    case 'del': B.items.splice(i, 1); rr(); break;
    case 'dup': B.items.splice(i + 1, 0, { ...JSON.parse(JSON.stringify(B.items[i])), id:'i' + Math.random().toString(36).slice(2, 9) }); rr(); break;
    case 'move': { const j = i + +b.dataset.d; if (j < 0 || j >= B.items.length) break; [B.items[i], B.items[j]] = [B.items[j], B.items[i]]; rr(); break; }
    case 'cycle': { const it = B.items[i], im = it.photo && it.photo.images; if (!im || im.length < 2 || it.photo.upload) break; it.photo.idx = ((it.photo.idx || 0) + 1) % im.length; rr(); break; }
    case 'search': { const it = B.items[i]; openSearch[it.id] = { q:guessQuery(it.desc), results:[], msg:'' }; renderForm(); runSearch(it.id, guessQuery(it.desc)); break; }
    case 'go': runSearch(b.dataset.id, $('#q-' + b.dataset.id).value.trim()); break;
    case 'close-search': delete openSearch[b.dataset.id]; renderForm(); break;
    case 'pick': pickProduct(b.dataset.id, b.dataset.h); break;
    case 'upload': uploadFor = B.items[i].id; $('#file').value = ''; $('#file').click(); break;
    case 'nophoto': B.items[i].photo = null; rr(); break;
    case 'disc-add': B.discounts.push({ on:true, label:'Nuevo descuento', pct:0 }); rr(); break;
    case 'disc-del': B.discounts.splice(i, 1); rr(); break;
    case 'cond-add': B.conditions.push({ label:'', text:'' }); rr(); break;
    case 'cond-del': B.conditions.splice(i, 1); rr(); break;
    case 'cond-move': { const j = i + +b.dataset.d; if (j < 0) break; [B.conditions[i], B.conditions[j]] = [B.conditions[j], B.conditions[i]]; rr(); break; }
    case 'cond-save':
      APP.settings.conditions = JSON.parse(JSON.stringify(B.conditions));
      APP.settings.discounts = JSON.parse(JSON.stringify(B.discounts)); APP.settings.discountBase = B.discountBase; APP.settings.deposit = { ...B.deposit };
      saveNow(); $('#condMsg').textContent = 'Guardadas. Los próximos presupuestos empiezan con estas condiciones, descuentos y seña.'; $('#condMsg').className = 'msg ok'; break;
    case 'cond-reset': B.conditions = JSON.parse(JSON.stringify(APP.settings.conditions)); rr(); break;
    case 'br-add': APP.settings.branches.push({ name:'Nueva sucursal', address:'', email:'', phone:'' }); rr(); break;
    case 'br-del': APP.settings.branches.splice(i, 1); if (+B.branch >= APP.settings.branches.length) B.branch = 0; rr(); break;
    case 'open-hist':
      if (B.items.length && !confirm('¿Abrir este presupuesto? Se reemplaza el que estás editando.')) break;
      APP.budget = B = JSON.parse(JSON.stringify(APP.history[i].budget)); rr(); break;
  }
});

renderForm();
renderPreview();
</script>
</body>
</html>
